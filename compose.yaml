services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: haemily
      POSTGRES_USER: haemily
      POSTGRES_PASSWORD: haemily
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - haemily_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haemily -d haemily"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  haemily_pg:
